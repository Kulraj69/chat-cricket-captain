<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat Cricket Captain — Control Room</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600;700&display=swap');
    :root{--lime:#d9ff43;--dark:#091510;--panel:#12231c;--muted:#9aaca4;--orange:#ff6433}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#174c38,#091510 45%);color:#fff;font-family:Inter,sans-serif;padding:44px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:34px}h1{font:800 58px/1 'Barlow Condensed';text-transform:uppercase;margin:0;color:var(--lime)}.sub{color:var(--muted);margin-top:8px}.live{background:#e52d49;padding:8px 13px;border-radius:30px;font-weight:700;font-size:13px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.card{background:#12231ce8;border:1px solid #ffffff18;border-radius:16px;padding:25px;box-shadow:0 20px 60px #0004}h2{font:700 25px 'Barlow Condensed';text-transform:uppercase;margin:0 0 20px}.preview{display:grid;grid-template-columns:1fr 1fr;gap:18px;background:#091510;padding:20px;border-radius:12px;margin-bottom:20px}.big{font:800 55px 'Barlow Condensed';color:var(--lime)}.muted{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.commentary{grid-column:1/-1;border-top:1px solid #ffffff17;padding-top:15px;color:#d5dfdb;min-height:50px}label{display:block;font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:15px 0 7px}input{width:100%;border:1px solid #ffffff20;border-radius:9px;background:#091510;color:white;padding:14px;font:16px Inter;outline:none}input:focus{border-color:var(--lime)}button{border:0;border-radius:9px;padding:13px 17px;background:var(--lime);color:#091510;font-weight:800;cursor:pointer}button:hover{filter:brightness(.9)}.send{display:grid;grid-template-columns:1fr auto;gap:9px}.shots{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.shots button{background:#264238;color:white;padding:9px 12px}.events{display:grid;grid-template-columns:1fr 1fr;gap:10px}.events button{background:#264238;color:#fff}.events .danger{background:var(--orange)}.status{font-size:13px;color:var(--muted);padding:14px 0}.link{color:var(--lime)}.feed{max-height:230px;overflow:auto}.item{padding:11px 0;border-bottom:1px solid #ffffff12;font-size:14px}.item b{color:var(--lime)}@media(max-width:760px){body{padding:22px}.grid{grid-template-columns:1fr}h1{font-size:42px}}
  </style>
</head>
<body><div class="wrap"><header class="top"><div><h1>Control Room</h1><div class="sub">Mock Twitch chat & event console</div></div><span class="live">● LIVE</span></header><main class="grid">
    <section class="card"><h2>Game monitor</h2><div class="preview"><div><div class="muted">Score</div><div class="big" id="score">0/0</div></div><div><div class="muted">Chase</div><div class="big"><span id="overs">0.0</span> ov</div></div><div class="commentary" id="commentary">Connecting…</div></div><div class="status" id="status"></div><p><a class="link" href="/overlay" target="_blank">Open OBS overlay ↗</a></p><button class="danger" onclick="post('/api/reset',{})">Reset innings</button></section>
    <section class="card"><h2>Send a chat vote</h2><label>Username</label><input id="user" value="cricketFan" maxlength="25"><label>Message</label><div class="send"><input id="message" value="!drive"><button onclick="send()">Send</button></div><div class="shots" id="shots"></div><h2 style="margin-top:28px">Simulate Twitch events</h2><div class="events"><button onclick="eventPost('channelPointRedeem',{title:'DRS'})">📺 Redeem DRS</button><button onclick="eventPost('cheer',{bits:100,user:'bitsBoss'})">⚡ Cheer / Bits</button><button class="danger" onclick="eventPost('raid',{viewers:42,user:'RaidCaptain'})">🔥 Incoming Raid</button></div><div class="feed" id="feed"></div></section>
  </main></div>
  <script>
    const $=id=>document.getElementById(id);const shots=['drive','pull','sweep','defend','six'];$('shots').innerHTML=shots.map(s=>`<button onclick="quick('${s}')">!${s}</button>`).join('');
    async function post(url,body){return fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json())}function send(){const body={user:$('user').value,message:$('message').value};post('/api/message',body);log(`<b>${safe(body.user)}</b>: ${safe(body.message)}`)}function quick(s){$('message').value='!'+s;send()}function eventPost(type,extra){post('/api/event',{type,...extra});log(`Event: <b>${type}</b>`)}function safe(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}function log(html){$('feed').insertAdjacentHTML('afterbegin',`<div class="item">${html}</div>`)}$('message').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
    function render(s){$('score').textContent=`${s.score}/${s.wickets}`;$('overs').textContent=s.overs;$('commentary').textContent=s.commentary;$('status').textContent=`${s.status.toUpperCase()} · ${s.totalVotes} current votes · ${s.twitchStatus}`}
    function connect(){const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onmessage=e=>render(JSON.parse(e.data).state);ws.onclose=()=>setTimeout(connect,1200)}connect();
  </script>
</body></html>
